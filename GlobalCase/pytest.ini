[pytest]
markers =
    icats:: marks tests as icat tests (deselect with '-m "not icats"')
    dashboard: marks tests as dashboard tests (deselect with '-m "not dashboard"')
    alarm: marks tests as alarm tests (deselect with '-m "not alarm"')
    inventory: marks tests as inventory tests (deselect with '-m "not inventory"')
    maintenance: marks tests as maintenance tests (deselect with '-m "not maintenance"')
    system: marks tests as system tests (deselect with '-m "not system"')
    node: marks tests as node tests (deselect with '-m "not node"')
    server: marks tests that stress/modify the EMS server (deselect with '-m "not server"')
    Icat: cases merged from Icat.py
    Restful: cases merged from Restful.py
    Provision: cases merged from Provision.py
    Unicase: cases merged from Unicase.py
