[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers
markers =
    smoke: quick environment or login checks
    ems: tests that connect to NetAtlas EMS
    selenium: browser-based UI tests
    restful: REST API tests
    inventory: inventory-related tests
    alarm: alarm-related tests
    maintenance: maintenance-related tests
    system: system-related tests
    node: node/device-related tests

